name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}\.playwright-browsers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag and version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version differ' }
      - name: Install Node deps
        run: npm ci
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Python release deps
        run: python -m pip install -r requirements-release.txt
      - name: Test update protection
        run: |
          node --test electron/tests/updates.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s electron/tests -p 'test*.py'
      - name: Install pinned Playwright browsers
        run: python -m playwright install chromium
      - name: Prepare verified model
        run: ./.github/scripts/prepare-model.ps1
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Generate icon
        run: python make_icon.py
      - name: Build backend
        run: ./build_backend.ps1
      - name: Build unsigned Windows installer
        run: npx --no-install electron-builder --win nsis --x64 --publish never
      - name: Validate release files and checksums
        run: node .github/scripts/verify-release.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            release/Media-Squirrel-Setup-*.exe
            release/Media-Squirrel-Setup-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
      - name: Create draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          fail_on_unmatched_files: true
          files: |
            release/Media-Squirrel-Setup-*.exe
            release/Media-Squirrel-Setup-*.exe.blockmap
            release/latest.yml
            release/SHA256SUMS.txt
          body: |
            Windows x64 unsigned release. No Authenticode certificate or Ed25519 manifest signature is included.
            Windows may display an unknown-publisher warning or block this installer under managed policies.
            Updates use this GitHub repository over HTTPS and the SHA512 in latest.yml.
            Download tasks continue while updates download. Installation requires confirmation and an idle task queue.
          generate_release_notes: true
