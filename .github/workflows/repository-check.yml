name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  privacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .github/scripts/check-repository.py
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install runtime and HTTP test dependencies
        run: python -m pip install -r requirements.txt httpx
      - name: Run isolated backend regressions
        run: python .github/scripts/run-tests.py --suite business
      - name: Run retained progress and runtime regressions
        run: python .github/scripts/run-tests.py --suite legacy
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies only
        working-directory: frontend
        run: npm ci
      - name: Run frontend regressions
        working-directory: frontend
        run: npm test
      - name: Run retained update protection regressions
        run: node --test electron/tests/updates.test.cjs
      - name: Build frontend
        working-directory: frontend
        run: npm run build
