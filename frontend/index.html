<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="only light" />
    <title>Media Squirrel</title>
    <link rel="icon" type="image/svg+xml" href="/squirrel.svg" />
  </head>
  <body>
    <div id="app">
      <!-- Visible even before the application bundle arrives. No simulated percentage. -->
      <div class="initial-startup" role="status"><img src="/squirrel.svg" width="74" height="74" alt=""/><h1>Media Squirrel</h1><p>正在加载网页界面…</p><div class="initial-track" role="progressbar" aria-label="加载网页资源"><span></span></div><a href="">长时间未加载？点击重试</a><noscript>请启用 JavaScript 后重新加载。</noscript></div>
    </div>
    <style>
      html { color-scheme:only light; background:#fff; }.initial-startup { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#fff; color:#222b38; font-family:system-ui,sans-serif; padding:24px; }.initial-startup h1 { font-size:25px; margin:14px 0 8px; }.initial-startup p,.initial-startup a { font-size:12px; color:#667085; }.initial-startup a { margin-top:24px; }.initial-track { width:min(320px,100%); height:6px; border-radius:6px; background:#eef4ff; overflow:hidden; margin-top:20px; }.initial-track span { display:block; width:30%; height:100%; border-radius:6px; background:#3e66bf; animation:initial-load 1.4s linear infinite; }@keyframes initial-load { from { transform:translateX(-100%); }to { transform:translateX(333.334%); } }
    </style>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
